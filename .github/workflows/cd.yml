name: UI CD

on:
  push:
    branches: [dev, staging, main]

concurrency:
  group: ui-cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: 9

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: ci
    environment: ${{ github.ref_name }}
    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=dev" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-dev" >> "$GITHUB_OUTPUT"
            echo "port=3000" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-staging" >> "$GITHUB_OUTPUT"
            echo "port=4000" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=production" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-prod" >> "$GITHUB_OUTPUT"
            echo "port=5000" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown branch '${{ github.ref_name }}' — expected 'dev', 'staging', or 'main'"
            exit 1
          fi

      - name: Validate environment file secret
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            ENV_FILE="$DEV_ENV_FILE"
            SECRET_NAME="DEV_ENV_FILE"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_FILE="$STAGING_ENV_FILE"
            SECRET_NAME="STAGING_ENV_FILE"
          elif [ "$BRANCH" = "main" ]; then
            ENV_FILE="$PRODUCTION_ENV_FILE"
            SECRET_NAME="PRODUCTION_ENV_FILE"
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "::error::$SECRET_NAME secret is empty or unset. Add it under Settings → Environments → $BRANCH → Secrets → $SECRET_NAME."
            exit 1
          fi
          echo "$SECRET_NAME is set"
          {
            echo "DOTENV<<__SB_UI_DOTENV__"
            echo "$ENV_FILE"
            echo "__SB_UI_DOTENV__"
          } >> "$GITHUB_ENV"

      # ── Build on runner ──────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build
        # NEXT_PUBLIC_* vars are baked in at build time; pass them from
        # the GitHub environment variables so they match what CI validates.
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
        run: pnpm build

      # ── Transfer artifacts to server ─────────────────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to server
        env:
          REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          DEST: ~/skillbridge/frontend/${{ steps.target.outputs.dir }}
        run: |
          ssh "$REMOTE" "mkdir -p ${DEST}"
          # compiled Next.js output
          rsync -az --delete .next/ "${REMOTE}:${DEST}/.next/"
          # static assets
          rsync -az --delete public/ "${REMOTE}:${DEST}/public/"
          # package manifest and Next.js config (needed for next start)
          rsync -az package.json pnpm-lock.yaml next.config.ts "${REMOTE}:${DEST}/"

      # ── Server-side: install runtime deps and restart ─────────────────────────
      - name: Install and restart on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOTENV: ${{ env.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOTENV
          script: |
            set -euo pipefail

            DEPLOY_DIR="$HOME/skillbridge/frontend/${{ steps.target.outputs.dir }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            PORT="${{ steps.target.outputs.port }}"

            cd "$DEPLOY_DIR"

            printf '%s\n' "$DOTENV" > .env
            chmod 600 .env

            pnpm install --frozen-lockfile

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              pm2 start node_modules/next/dist/bin/next --name "$APP_NAME" -- start -p "$PORT"
            fi
            pm2 save
