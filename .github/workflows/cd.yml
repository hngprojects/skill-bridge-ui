name: UI CD

on:
  push:
    branches: [dev, staging, main]

concurrency:
  group: ui-cd-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: 9

jobs:
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: ci
    environment: ${{ github.ref_name }}
    steps:
      - name: Set deploy target
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "dir=dev" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-dev" >> "$GITHUB_OUTPUT"
            echo "port=3000" >> "$GITHUB_OUTPUT"
            echo "branch=dev" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-staging" >> "$GITHUB_OUTPUT"
            echo "port=4000" >> "$GITHUB_OUTPUT"
            echo "branch=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=production" >> "$GITHUB_OUTPUT"
            echo "app=skillbridge-ui-prod" >> "$GITHUB_OUTPUT"
            echo "port=5000" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown branch '${{ github.ref_name }}' — expected 'dev', 'staging', or 'main'"
            exit 1
          fi

      - name: Validate environment file secret
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "dev" ]; then
            ENV_FILE="$DEV_ENV_FILE"
          elif [ "$BRANCH" = "staging" ]; then
            ENV_FILE="$STAGING_ENV_FILE"
          elif [ "$BRANCH" = "main" ]; then
            ENV_FILE="$PRODUCTION_ENV_FILE"
          fi
          if [ -z "$ENV_FILE" ]; then
            echo "::error::ENV_FILE secret for '$BRANCH' is empty or unset. Add it under Settings → Environments → $BRANCH → Secrets."
            exit 1
          fi
          echo "ENV_FILE is set (${#ENV_FILE} chars)"
          {
            echo "DOTENV<<__SB_UI_DOTENV__"
            echo "$ENV_FILE"
            echo "__SB_UI_DOTENV__"
          } >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOTENV: ${{ env.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOTENV
          script: |
            set -e

            DEPLOY_DIR="$HOME/skillbridge/frontend/${{ steps.target.outputs.dir }}"
            APP_NAME="${{ steps.target.outputs.app }}"
            BRANCH="${{ steps.target.outputs.branch }}"
            PORT="${{ steps.target.outputs.port }}"
            REPO="https://github.com/${{ github.repository }}.git"

            if [ -z "$DOTENV" ]; then
              echo "FATAL: env payload is empty"
              exit 1
            fi

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            if [ ! -d ".git" ]; then
              git clone --branch "$BRANCH" "$REPO" .
            else
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            printf '%s\n' "$DOTENV" > .env
            chmod 600 .env

            pnpm install --frozen-lockfile
            pnpm build

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              pm2 start node_modules/next/dist/bin/next --name "$APP_NAME" -- start -p "$PORT"
            fi
            pm2 save
